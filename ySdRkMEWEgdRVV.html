<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#170e24"><title>Repte 4 · Gimcana de Nit d’Ànimes</title><style>
:root{color-scheme:dark;--orange:#ffc477;--violet:#a879c6}*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff1e3;background:radial-gradient(ellipse at 50% -10%,#5c3169 0,#25132e 43%,#110d1b 100%);padding:18px 12px 40px}.wrap{max-width:550px;margin:auto}.mast{text-align:center;margin:10px 0 20px}.moon{font-size:52px;filter:drop-shadow(0 0 20px #ffac57);animation:float 4s ease-in-out infinite}.eyebrow{letter-spacing:.18em;color:#d7b7e8;text-transform:uppercase;font-size:11px;font-weight:800}.mast h1{font-family:Georgia,serif;font-size:clamp(29px,8vw,40px);color:var(--orange);line-height:1.08;margin:8px 0;text-shadow:0 2px 25px #df722a55}.subtitle{color:#e0c7dc;font-style:italic;margin:6px 0}.card{background:linear-gradient(160deg,#38213f,#21172e);border:1px solid #865d91;border-radius:23px;padding:22px 18px;box-shadow:0 14px 45px #09051099}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{font-size:12px;font-weight:800;letter-spacing:.1em;color:#f9ca8a;border:1px solid #a77763;border-radius:30px;padding:7px 11px}.question{font-size:clamp(19px,5vw,24px);line-height:1.35;margin:25px 0 20px;font-weight:750}.options{display:grid;gap:11px}.choice{width:100%;text-align:left;color:#fff2e9;background:#493251;border:1px solid #916b9f;border-radius:13px;padding:16px 14px;font:inherit;font-size:16px;cursor:pointer;transition:transform .15s,background .15s}.choice:active{transform:scale(.98)}.choice:hover{background:#604168}.letter{font-size:94px;font-weight:900;line-height:1.1;color:#ffca76;text-shadow:0 0 32px #ffa02b;animation:pop .55s cubic-bezier(.2,1.5,.3,1)}.result{text-align:center;animation:pop .5s ease-out}.result h2{font-size:25px;color:#baf6b8;margin:10px 0}.result.bad h2{color:#ffaaaa}.result .emoji{font-size:64px}.result p{color:#ead6e7}.action{background:#d88037;color:#1b1020;border:0;border-radius:13px;padding:13px 19px;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px}.notice{background:#584029;border:1px solid #b88c50;border-radius:11px;padding:11px 12px;color:#ffe2a7;font-size:13px;margin:12px 0}.foot{text-align:center;color:#bea5c3;font-size:12px;margin:18px 0}.nav{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}.nav select,.nav button{background:#302039;color:white;border:1px solid #7b5b8a;border-radius:10px;padding:10px;font:inherit}.nav button{cursor:pointer}.nav button:disabled{opacity:.35}.foods{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.food{text-align:center;background:#35263e;border:1px solid #725580;border-radius:12px;padding:10px 3px;font-size:12px}.food span{display:block;font-size:36px;margin-bottom:4px}.pumpkins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.pumpkin{text-align:center;background:#35263e;border:1px solid #725580;border-radius:12px;padding:8px 3px}.pumpkin svg{width:100%;max-width:108px;height:78px}.pumpkin b{display:block;color:#ffdbac}.muted{color:#d2bcd8;font-size:13px}.spark{position:fixed;pointer-events:none;font-size:26px;animation:fall 1.5s ease-in forwards;z-index:20}@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}@keyframes float{50%{transform:translateY(-8px)}}@keyframes fall{to{transform:translateY(120px) rotate(110deg);opacity:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.music-player{background:#392b47;border:1px solid #956d9d;border-radius:14px;padding:14px;margin:14px 0;text-align:center}.music-player audio{display:block;width:100%;margin:12px 0}.music-label{font-weight:800;color:#ffcf8c}.music-player .muted{margin:8px 0 0}
</style></head><body data-repte="4"><main class="wrap"><header class="mast"><div class="moon" aria-hidden="true">🌙👻</div><div class="eyebrow">Una aventura misteriosa</div><h1>Gimcana de Nit d’Ànimes</h1><p class="subtitle">Per gaudir juntes l’arribada de la foscor</p></header><section class="card" id="card"><div class="top"><span class="tag" id="tag"></span><span aria-hidden="true">🎃 ✨ 🦇</span></div><div id="content" aria-live="polite"></div></section><p class="foot">Apunta la lletra al plànol misteriós · Intents il·limitats</p></main><script>
const challenges=[
{q:'Quin dolç es preparava tradicionalment a Catalunya per donar a les ànimes que es recordaven?',a:['Caramels','Panellets','Dònuts'],ok:1,l:'L'},
{q:'Com es diu el gat de la castanyera?',a:['Félix','Marrameu','Marramiau'],ok:1,l:'R'},
{q:'Com es diu “Bruixa” en anglès?',a:['Witch','Pich','Wish'],ok:0,l:'C'},
{q:'Troba la parella de carbasses amb la mateixa forma:',a:['La 1 i la 3','La 2 i la 4','La 5 i la 6'],ok:1,l:'E',type:'pumpkin'},
{q:'Doneu el PLAY a aquesta cançó i feu el Ball dels Esquelets!',a:['Ens ha agradat molt!','Ens ha fet vergonya!','Ens movíem menys que un esquelet a la tomba'],ok:'all',l:'D',type:'music'},
{q:'Què celebrem per la Castanyada i la Nit d’Ànimes?',a:['L’inici de la primavera','L’inici de la foscor','L’inici de l’hivern'],ok:1,l:'G'},
{q:'A quin grup d’animals pertany el Ratpenat?',a:['Aus','Mamífers','Rèptils'],ok:1,l:'N'},
{q:'Udoleu ben fort com si fóssiu l’Home llop!',a:['S’ha sentit fins a Terrassa!','Més aviat semblaven un home porc','Ens ha encantat!'],ok:'all',l:'P'},
{q:'Quins d’aquests aliments són de la temporada de tardor?',a:['1, 3 i 6','1, 3 i 4','2, 3 i 5'],ok:1,l:'O',type:'foods'},
{q:'Quantes castanyes veus a la façana de la casa?',a:['11','15','17'],ok:2,l:'S'},
{q:'Inventeu una cançó que contingui aquestes quatre paraules: sucre, moniato, mort i esquelet.',a:['Ens ha quedat genial!','Ens ha fet molta vergonya!','Six seven!'],ok:'all',l:'T'}
];
const $=id=>document.getElementById(id);const current=Number(document.body.dataset.repte);
function pumpkinSvg(shape){const widths=[34,39,31,43,35,30],w=widths[shape];const top=[18,13,22,17,15,23][shape],bottom=[68,73,65,70,75,67][shape];return `<svg viewBox="0 0 100 85" role="img" aria-label="Carbassa"><path d="M50 ${top+7} Q46 12 55 7" fill="none" stroke="#5eab56" stroke-width="6" stroke-linecap="round"/><path d="M50 ${top} C${50-w} ${top-9} ${50-w-12} ${bottom-5} 50 ${bottom} C${50+w+12} ${bottom-5} ${50+w} ${top-9} 50 ${top}" fill="#e9842d" stroke="#ffba62" stroke-width="2"/><path d="M50 ${top} C${50-w/2} ${top-3} ${50-w/2} ${bottom+2} 50 ${bottom} C${50+w/2} ${bottom+2} ${50+w/2} ${top-3} 50 ${top}" fill="none" stroke="#ad531f" stroke-width="2"/></svg>`}
function extra(c){if(c.type==='pumpkin'){let shapes=[0,1,2,1,4,5];return `<div class="pumpkins">${shapes.map((s,i)=>`<div class="pumpkin">${pumpkinSvg(s)}<b>${i+1}</b></div>`).join('')}</div>`}if(c.type==='foods'){return `<div class="foods">${[['🍠','Moniato'],['🍍','Pinya'],['🍊','Mandarina'],['🌰','Castanya'],['🍅','Tomàquet'],['🍒','Cireres']].map((f,i)=>`<div class="food"><span>${f[0]}</span><b>${i+1}. ${f[1]}</b></div>`).join('')}</div>`}if(c.type==='music'){return `<div class="music-player"><div class="music-label">🎵 El Ball dels Esquelets</div><audio controls preload="none" src="ball-dels-esquelets.mp3">El teu navegador no pot reproduir aquest àudio.</audio><p class="muted">Premeu Play, balleu i després trieu una resposta!</p></div>`}return ''}
function render(){const c=challenges[current-1];$('tag').textContent=`REPTE ${String(current).padStart(2,'0')} / 11`;$('content').innerHTML=`<h2 class="question">${c.q}</h2>${extra(c)}<div class="options">${c.a.map((a,i)=>`<button class="choice" data-answer="${i}"><b>${'ABC'[i]}.</b> ${a}</button>`).join('')}</div>`;$('content').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)))}
function answer(i){const c=challenges[current-1],correct=c.ok==='all'||i===c.ok;$('content').innerHTML=correct?`<div class="result"><div class="emoji">🎉👻🎃</div><h2>Has alliberat una ànima!</h2><p>Has descobert la lletra secreta:</p><div class="letter">${c.l}</div><p>Apunta-la al teu plànol misteriós!</p><button class="action" id="retry">Tornar a veure el repte</button></div>`:`<div class="result bad"><div class="emoji">💀❌</div><h2>Resposta incorrecta!</h2><p>El fantasma encara guarda el secret...</p><button class="action" id="retry">🔄 Tornar-ho a provar</button></div>`;$('retry').onclick=render;if(correct)confetti()}
function confetti(){for(let i=0;i<19;i++){let s=document.createElement('span');s.className='spark';s.textContent=['✨','🎃','⭐','👻'][i%4];s.style.left=(10+Math.random()*80)+'vw';s.style.top=(15+Math.random()*25)+'vh';s.style.animationDelay=(Math.random()*.35)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),1900)}}
render();
</script></body></html>
